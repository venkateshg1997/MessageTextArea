<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message</title>
</head>

<style>
     body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    textarea {
      width: 100%;
      height: 100px;
      font-size: 16px;
      padding: 10px;
      box-sizing: border-box;
    }
    .counter {
      margin-top: 10px;
      font-size: 14px;
      color: #333;
    }
    .warning {
      color: red;
      font-weight: bold;
      display: none;
    }
</style>
<body>

    <div id="column">
    <h2>Message Box(200 character Max)</h2>
    <textarea id="Message" placeholder="Enter your Message"></textarea>
    <div class="counter" id="counter">Counter (0/200)</div>
    <div class="warning" id="warning">!!!You Have Reached the Limit</div>
    </div>

</body>

<script>
    var Message=document.getElementById("Message")
    var counter=document.getElementById("counter")
    var warning=document.getElementById("warning")
    
    var maxchar=200

    Message.addEventListener("input", function(){

        const charlen = Message.value.length
        if(charlen<=maxchar){

            counter.textContent=`${charlen}/${maxchar} character`
            warning.style.display = "none";
            
        }
        else{
            Message.value=Message.value.substring(0, 200)
            warning.style.display = "block";

        }
        console.log(event.target.value)

    })

</script>



</html>
